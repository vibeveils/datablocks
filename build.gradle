plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"datablocks" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Zips the example pack so it can be dropped straight into datapacks/ and resourcepacks/.
tasks.register('examplePack', Zip) {
	from 'example_pack'
	archiveFileName = 'datablocks-example-pack.zip'
	destinationDirectory = layout.buildDirectory.dir('libs')
}

// The Oddlands showcase: a data pack and a resource pack built entirely on Data Blocks.
tasks.register('oddlandsDatapack', Zip) {
	from 'oddlands/oddlands_datapack'
	archiveFileName = 'oddlands-datapack.zip'
	destinationDirectory = layout.buildDirectory.dir('libs')
}

tasks.register('oddlandsResourcepack', Zip) {
	from 'oddlands/oddlands_resourcepack'
	archiveFileName = 'oddlands-resourcepack.zip'
	destinationDirectory = layout.buildDirectory.dir('libs')
}

tasks.register('packs') {
	dependsOn 'examplePack', 'oddlandsDatapack', 'oddlandsResourcepack'
}
