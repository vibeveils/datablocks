# Builds the mod and the example pack on every push and pull request.
# Pushing a tag like "v0.1.0" also publishes a GitHub release with both files attached.

name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Use tag as mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version=.*/version=${VERSION}/" gradle.properties
          echo "Building version ${VERSION}"

      - name: Build mod and packs
        run: ./gradlew build packs --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: datablocks
          path: |
            build/libs/*.jar
            build/libs/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/datablocks-*.jar
            build/libs/*.zip
